<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eef1f7" />
  <title>Ngapaya — Marketing OS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="login-screen" class="login-screen hidden"></div>
  <div id="app-shell" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-wrap">
        <div class="brand-mark">N</div>
        <div>
          <div class="brand-name">ngapaya</div>
          <div class="brand-subtitle">Marketing OS</div>
        </div>
        <button class="icon-button close-sidebar" data-action="close-sidebar" aria-label="Tutup menu"><span data-icon="close"></span></button>
      </div>

      <div class="workspace-switcher soft-inset">
        <div class="workspace-avatar">H</div>
        <div class="workspace-copy">
          <strong>HBI Marketing</strong>
          <span>Workspace utama</span>
        </div>
        <span class="chevron">⌄</span>
      </div>

      <nav class="main-nav" aria-label="Navigasi utama">
        <div class="nav-label">WORKSPACE</div>
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon" data-icon="home"></span><span>Dashboard</span></button>
        <button class="nav-item" data-view="campaigns"><span class="nav-icon" data-icon="campaign"></span><span>Campaign</span><span class="nav-count">4</span></button>
        <button class="nav-item" data-view="todo"><span class="nav-icon" data-icon="check-square"></span><span>To-Do</span><span class="nav-count attention">12</span></button>

        <div class="nav-label nav-gap">OPERASIONAL</div>
        <button class="nav-item" data-view="calendar"><span class="nav-icon" data-icon="calendar"></span><span>Kalender Konten</span></button>
        <button class="nav-item" data-view="requests"><span class="nav-icon" data-icon="sparkles"></span><span>Request & Ide</span><span class="nav-count coral">3</span></button>
        <button class="nav-item" data-view="partners"><span class="nav-icon" data-icon="handshake"></span><span>Mitra & Keuangan</span></button>
        <button class="nav-item" data-view="analytics"><span class="nav-icon" data-icon="chart"></span><span>Analitik Sosmed</span></button>

        <div class="nav-label nav-gap">AKUN</div>
        <button class="nav-item" data-view="account"><span class="nav-icon" data-icon="user"></span><span>Akun & Keamanan</span></button>
      </nav>

      <div class="sidebar-bottom">
        <div class="help-card">
          <div class="help-orb">?</div>
          <div><strong>Butuh bantuan?</strong><span>Pelajari cara kerja Ngapaya</span></div>
          <span class="arrow">↗</span>
        </div>
        <div class="user-mini">
          <div class="avatar avatar-purple">AS</div>
          <div class="user-mini-copy"><strong>Andi Saputra</strong><span>CMO · HBI</span></div>
          <button class="icon-button" data-view="account" aria-label="Buka akun">•••</button>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button menu-toggle" data-action="open-sidebar" aria-label="Buka menu"><span data-icon="menu"></span></button>
          <div class="crumbs"><span>Workspace</span><b>/</b><strong id="page-title">Dashboard</strong></div>
        </div>
        <div class="topbar-actions">
          <label class="search-box"><span data-icon="search"></span><input id="global-search" type="search" placeholder="Cari apa saja..." /></label>
          <button class="icon-button theme-button" data-action="toggle-theme" aria-label="Ubah tema"><span data-icon="moon"></span></button>
          <button class="icon-button notification-button" data-action="notifications" aria-label="Notifikasi"><span data-icon="bell"></span><i></i></button>
          <button class="top-profile" data-view="account"><span class="avatar avatar-purple">AS</span><span class="top-profile-copy"><strong>Andi Saputra</strong><small>CMO</small></span><span class="chevron">⌄</span></button>
        </div>
      </header>

      <div id="page-content" class="page-content"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <div id="modal-root"></div>
  <script src="app.js"></script>
</body>
</html>
